name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Källkodsutcheckning
        uses: actions/checkout@v4

      - name: Konfigurera Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installera paket
        run: |
          cd frontend
          npm ci

      - name: Bygg Next.js-projektet (Typecheck & Build)
        run: |
          cd frontend
          npm run build